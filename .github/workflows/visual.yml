name: visual

# 为什么不是 pull_request 自动跑：
#   像素基线与「渲染它的机器」强绑定。即使同一 macOS 版本，runner 与本地在
#   字体（PingFang SC / SF 的可用性与版本）、抗锯齿、GPU 光栅化上仍有差异，
#   实测 15 张基线在 runner 上全部出现 1~2% 文本像素差异、通道差 200+。
#   强行调阈值等于把守门器调成摆设，所以这里改为手动触发：
#   在固定环境（建议与生成基线的同一台 macOS）执行 `pnpm test:visual` 或触发本 workflow。
#   PR 上的自动守门仍由 ci.yml（typecheck / lint / test / build）承担。
#
# 浅色与深色是两个独立 job：一套跑挂不会带走另一套，且各自上传自己的 actual/diff。
on:
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      # 两套主题互不依赖：一套失败时仍要把另一套的差异图传上去
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      # 手动触发时以「更新基线」为目的：runner 与本地渲染不同，直接更新会污染基线，
      # 因此这里只产出对比结果与差异图，供人工判断。
      - run: pnpm test:visual --theme=${{ matrix.theme }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.theme }}-actual-and-diff
          path: |
            e2e/__shots__/actual
            e2e/__shots__/diff
          if-no-files-found: ignore
          retention-days: 7