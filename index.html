<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#7954cb" />
  <title>EMOS · 音乐服</title>
  <script>
    // 首屏防闪烁：Vue 挂载前按 localStorage + 系统偏好先写好 data-theme（与 useTheme 同一套规则）
    ;(function () {
      var preference = null
      try {
        preference = localStorage.getItem('music-theme')
      } catch (error) {
        preference = null
      }
      var prefersDark =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      if (preference === 'dark' || (preference !== 'light' && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    })()
  </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
